<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="400" viewBox="0 0 1500 400">
  <defs>
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="400" fill="#0d1117"/>

  <!-- Topographic contour lines — right side, organic and layered -->
  <g opacity="0.18" fill="none" stroke="#c9a96e" stroke-width="0.8" filter="url(#blur1)">
    <ellipse cx="1180" cy="200" rx="320" ry="180" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="275" ry="148" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="232" ry="118" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="192" ry="92" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="155" ry="70" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="120" ry="52" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="88" ry="36" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="58" ry="22" transform="rotate(-8 1180 200)"/>
    <ellipse cx="1180" cy="200" rx="32" ry="12" transform="rotate(-8 1180 200)"/>
  </g>

  <!-- Secondary contour cluster — offset, gives terrain depth -->
  <g opacity="0.09" fill="none" stroke="#c9a96e" stroke-width="0.6" filter="url(#blur1)">
    <ellipse cx="1050" cy="130" rx="210" ry="120" transform="rotate(15 1050 130)"/>
    <ellipse cx="1050" cy="130" rx="170" ry="95" transform="rotate(15 1050 130)"/>
    <ellipse cx="1050" cy="130" rx="132" ry="72" transform="rotate(15 1050 130)"/>
    <ellipse cx="1050" cy="130" rx="96" ry="52" transform="rotate(15 1050 130)"/>
    <ellipse cx="1050" cy="130" rx="62" ry="34" transform="rotate(15 1050 130)"/>
    <ellipse cx="1050" cy="130" rx="32" ry="18" transform="rotate(15 1050 130)"/>
  </g>

  <!-- Tertiary cluster — bottom right -->
  <g opacity="0.07" fill="none" stroke="#c9a96e" stroke-width="0.5">
    <ellipse cx="1350" cy="320" rx="180" ry="100" transform="rotate(-20 1350 320)"/>
    <ellipse cx="1350" cy="320" rx="140" ry="75" transform="rotate(-20 1350 320)"/>
    <ellipse cx="1350" cy="320" rx="100" ry="52" transform="rotate(-20 1350 320)"/>
    <ellipse cx="1350" cy="320" rx="64" ry="32" transform="rotate(-20 1350 320)"/>
  </g>

  <!-- Left edge fade — creates natural boundary between text and contours -->
  <defs>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="400" fill="url(#fadeRight)"/>

  <!-- Name -->
  <text
    x="88"
    y="188"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="82"
    font-weight="700"
    fill="#f0f6fc"
    letter-spacing="-1">Surabhi Pradhan</text>

  <!-- Role line -->
  <text
    x="92"
    y="240"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="400"
    fill="#8b949e"
    letter-spacing="3">AI ENGINEER  ·  11 YEARS  ·  BANGALORE</text>

  <!-- Divider -->
  <rect x="88" y="264" width="480" height="1" fill="#30363d"/>

  <!-- Positioning line -->
  <text
    x="88"
    y="298"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-style="italic"
    fill="#6e7681"
    letter-spacing="0.3">Building systems at the intersection of technology and business</text>

</svg>
